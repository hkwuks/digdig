name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: build & test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 18.x is the `engines` floor declared in cli/package.json. Keep the
        # matrix floor equal to the declared floor, or the declaration is a
        # claim nothing checks. If 18.x fails, fix the code or raise `engines`
        # — do not delete the leg.
        node: [18.x, 20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          # The lockfile lives under cli/, not at the repo root. Pointing the
          # cache here is what makes it work at all; the default would silently
          # miss and re-download every run.
          cache: npm
          cache-dependency-path: cli/package-lock.json

      - name: Install
        working-directory: cli
        run: npm ci

      - name: Build
        working-directory: cli
        run: npm run build

      - name: Test
        working-directory: cli
        run: npm test
