name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The published npm package declares `engines.node >= 18.0.0`, so 18.x is a
  # promise to users, not a preference. The test runner cannot run there —
  # vitest 4 requires Node ^20 and its rolldown dependency needs ^20.19 for
  # node:util's styleText — but `tsc` can, so 18 keeps a build check rather than
  # being dropped from the matrix. Dropping it would leave the engines floor
  # unchecked, which is how a declaration becomes decoration.
  build:
    name: build (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18.x, 20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          # The lockfile lives under cli/, not at the repo root. Pointing the
          # cache here is what makes it work at all; the default would silently
          # miss and re-download every run.
          cache: npm
          cache-dependency-path: cli/package-lock.json

      - name: Install
        working-directory: cli
        run: npm ci

      - name: Build
        working-directory: cli
        run: npm run build

  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Matrix floor is where vitest can actually run. Raising the published
        # `engines` is a separate, user-facing decision — it changes the install
        # warning every existing user sees — so it is not made here.
        node: [20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: cli/package-lock.json

      - name: Install
        working-directory: cli
        run: npm ci

      - name: Test
        working-directory: cli
        run: npm test
