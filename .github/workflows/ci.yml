name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Exercise both the exact supported floor and the current Node 24 LTS.
  build:
    name: build (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [24.15.0, 24.x]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          # The lockfile lives under cli/, not at the repo root. Pointing the
          # cache here is what makes it work at all; the default would silently
          # miss and re-download every run.
          cache: npm
          cache-dependency-path: cli/package-lock.json

      - name: Install
        working-directory: cli
        run: npm ci

      - name: Build
        working-directory: cli
        run: npm run build

  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [24.15.0, 24.x]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: cli/package-lock.json

      - name: Install
        working-directory: cli
        run: npm ci

      - name: Test
        working-directory: cli
        run: npm test
